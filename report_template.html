<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peak Shaving Report</title>
<style>
  :root {
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #15803d;
    --avg-w: 96px;
    --site-w: 78px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #f8fafc;
  }
  header {
    padding: 20px 28px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .toggle button {
    border: none;
    background: transparent;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 550;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .table-wrap {
    margin: 0 28px 28px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    overflow: auto;
    max-height: calc(100vh - 130px);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
  th, td {
    padding: 7px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #f1f5f9;
    font-weight: 600;
    color: var(--muted);
  }
  thead th.site-head {
    left: 0;
    z-index: 4;
    text-align: left;
    width: var(--site-w);
    min-width: var(--site-w);
  }
  thead th.avg-head {
    left: var(--site-w);
    z-index: 4;
    text-align: right;
    width: var(--avg-w);
    min-width: var(--avg-w);
    color: var(--text);
  }
  tbody th.site {
    position: sticky;
    left: 0;
    z-index: 1;
    width: var(--site-w);
    min-width: var(--site-w);
    background: #f1f5f9;
    text-align: left;
    font-weight: 600;
  }
  tbody td.avg {
    position: sticky;
    left: var(--site-w);
    z-index: 1;
    width: var(--avg-w);
    min-width: var(--avg-w);
    background: #eef2f6;
    text-align: right;
    font-weight: 650;
    color: var(--text);
    border-right: 1px solid var(--border);
  }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: none; }
  td.empty { color: #cbd5e1; text-align: center; }
  tr.group th {
    background: #e2ebf3;
    text-align: left;
    font-weight: 650;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    border-top: 1px solid #cbd5e1;
  }
  tr.group th:hover { background: #d7e2ec; }
  tr.group .group-label {
    position: sticky;
    left: 12px;
    display: inline-flex;
    align-items: center;
  }
  tr.group .arrow {
    display: inline-block;
    width: 14px;
    font-size: 10px;
    color: var(--muted);
  }
  tr.group .count {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    border-radius: 9px;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
  }
  .legend {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend .bar {
    width: 120px;
    height: 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: linear-gradient(to right, #ffffff, rgb(21, 128, 61));
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Peak Shaving Report</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span class="legend">low <span class="bar"></span> high</span>
    <div class="toggle">
      <button id="btn-expand">Expand all</button>
      <button id="btn-collapse">Collapse all</button>
    </div>
    <div class="toggle">
      <button data-metric="demand" class="active">Demand shaved (kW)</button>
      <button data-metric="demandPct">Demand shaved (%)</button>
      <button data-metric="energy">Energy delivered (kWh)</button>
      <button data-metric="energyPct">Energy delivered (%)</button>
    </div>
  </div>
</header>
<div class="table-wrap">
  <table id="matrix"></table>
</div>
<script>
const DATA = __DATA_JSON__;

const customers = Object.keys(DATA.customers).sort((a, b) => {
  const na = Number(a), nb = Number(b);
  if (!isNaN(na) && !isNaN(nb)) return na - nb;
  return a.localeCompare(b);
});

const monthSet = new Set();
for (const id of customers) {
  for (const m of DATA.customers[id]) monthSet.add(m.month);
}
const months = [...monthSet].sort();

const METRICS = {
  demand: { key: "total_demand_shaved_kw", label: "Demand shaved (kW)", unit: "kW", pct: false },
  demandPct: { key: "total_demand_shaved_pct", label: "Demand shaved (%)", unit: "%", pct: true },
  energy: { key: "total_energy_delivered_kwh", label: "Energy delivered (kWh)", unit: "kWh", pct: false },
  energyPct: { key: "total_energy_delivered_pct", label: "Energy delivered (%)", unit: "%", pct: true },
};
let metric = "demand";

// lookup[customer][month] = month record
const lookup = {};
for (const id of customers) {
  lookup[id] = {};
  for (const m of DATA.customers[id]) lookup[id][m.month] = m;
}

const META = DATA.meta || {};
function subIndustryOf(id) {
  const m = META[id];
  return (m && m.sub_industry) ? m.sub_industry : "Unknown";
}

// Group customers by sub-industry, groups sorted alphabetically; customer
// order within a group preserves the numeric sort from above.
const groups = (() => {
  const byName = new Map();
  for (const id of customers) {
    const name = subIndustryOf(id);
    if (!byName.has(name)) byName.set(name, []);
    byName.get(name).push(id);
  }
  return [...byName.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([name, ids]) => ({ name, ids }));
})();

const collapsed = new Set();

const GREEN = [21, 128, 61];
function cellColor(v, max) {
  if (max <= 0) return "#ffffff";
  const t = Math.max(0, Math.min(1, v / max));
  const c = GREEN.map(g => Math.round(255 + (g - 255) * t));
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

function fmt(v) {
  if (METRICS[metric].pct) {
    return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  }
  return v.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

function monthLabel(m) {
  const [y, mo] = m.split("-");
  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${names[Number(mo) - 1]} ${y}`;
}

function render() {
  const key = METRICS[metric].key;
  let max = 0;
  for (const id of customers) {
    for (const m of months) {
      const rec = lookup[id][m];
      if (rec) max = Math.max(max, rec[key]);
    }
  }

  const unit = METRICS[metric].unit;
  const totalCols = months.length + 2;
  let html = "<thead><tr>"
    + `<th class="site-head">Customer</th>`
    + `<th class="avg-head">Avg ${unit}</th>`;
  for (const m of months) html += `<th>${monthLabel(m)}</th>`;
  html += "</tr></thead><tbody>";
  for (const g of groups) {
    const isCollapsed = collapsed.has(g.name);
    const arrow = isCollapsed ? "\u25B6" : "\u25BC";
    html += `<tr class="group${isCollapsed ? " collapsed" : ""}" data-group="${encodeURIComponent(g.name)}">`
      + `<th colspan="${totalCols}"><span class="group-label"><span class="arrow">${arrow}</span>${g.name}`
      + `<span class="count">${g.ids.length}</span></span></th></tr>`;
    if (isCollapsed) continue;
    for (const id of g.ids) {
      const present = months.map(m => lookup[id][m]).filter(Boolean);
      const avg = present.length
        ? present.reduce((s, rec) => s + rec[key], 0) / present.length
        : null;
      const avgCell = avg === null
        ? `<td class="avg empty">&ndash;</td>`
        : `<td class="avg">${fmt(avg)}</td>`;
      html += `<tr><th class="site">${id}</th>${avgCell}`;
      for (const m of months) {
        const rec = lookup[id][m];
        if (rec) {
          const v = rec[key];
          const t = max > 0 ? v / max : 0;
          const fg = t > 0.6 ? "#ffffff" : "var(--text)";
          html += `<td style="background:${cellColor(v, max)}; color:${fg}">${fmt(v)}</td>`;
        } else {
          html += `<td class="empty">&ndash;</td>`;
        }
      }
      html += "</tr>";
    }
  }
  html += "</tbody>";
  document.getElementById("matrix").innerHTML = html;
  document.getElementById("subtitle").textContent =
    `${METRICS[metric].label} per customer per month · N=${DATA.params.N}, L=${DATA.params.L} · ${customers.length} customers · ${groups.length} sub-industries`;
  document.querySelectorAll("[data-metric]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.metric === metric);
  });
}

document.querySelectorAll("[data-metric]").forEach(btn => {
  btn.addEventListener("click", () => { metric = btn.dataset.metric; render(); });
});

document.getElementById("matrix").addEventListener("click", (e) => {
  const row = e.target.closest("tr.group");
  if (!row) return;
  const name = decodeURIComponent(row.dataset.group);
  if (collapsed.has(name)) collapsed.delete(name);
  else collapsed.add(name);
  render();
});

document.getElementById("btn-expand").addEventListener("click", () => { collapsed.clear(); render(); });
document.getElementById("btn-collapse").addEventListener("click", () => {
  for (const g of groups) collapsed.add(g.name);
  render();
});

render();
</script>
</body>
</html>
