<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peak Shaving Report</title>
<style>
  :root {
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #1a73e8;
    --avg-w: 96px;
    --lf-w: 72px;
    --site-w: 78px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #f8fafc;
  }
  header {
    padding: 20px 28px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .toggle button {
    border: none;
    background: transparent;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 550;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .table-wrap {
    margin: 0 28px 28px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    overflow: auto;
    max-height: calc(100vh - 130px);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
  th, td {
    padding: 7px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #f1f5f9;
    font-weight: 600;
    color: var(--muted);
  }
  thead th.site-head {
    left: 0;
    z-index: 4;
    text-align: left;
    width: var(--site-w);
    min-width: var(--site-w);
  }
  thead th.abs-head {
    left: calc(var(--site-w) + var(--lf-w));
    z-index: 4;
    text-align: right;
    width: var(--avg-w);
    min-width: var(--avg-w);
    color: var(--text);
  }
  thead th.pct-head {
    left: calc(var(--site-w) + var(--lf-w) + var(--avg-w));
    z-index: 4;
    text-align: right;
    width: var(--avg-w);
    min-width: var(--avg-w);
    color: var(--text);
  }
  thead th.lf-head {
    left: var(--site-w);
    z-index: 4;
    text-align: right;
    width: var(--lf-w);
    min-width: var(--lf-w);
    color: var(--text);
    border-right: 1px solid var(--border);
  }
  tbody th.site {
    position: sticky;
    left: 0;
    z-index: 1;
    width: var(--site-w);
    min-width: var(--site-w);
    background: #f1f5f9;
    text-align: left;
    font-weight: 600;
  }
  tbody th.site a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
  }
  tbody th.site a:hover {
    text-decoration: none;
    border-bottom-color: var(--accent);
  }
  tbody td.avg {
    position: sticky;
    z-index: 1;
    width: var(--avg-w);
    min-width: var(--avg-w);
    background: #eef2f6;
    text-align: right;
    font-weight: 650;
    color: var(--text);
  }
  tbody td.abs { left: calc(var(--site-w) + var(--lf-w)); }
  tbody td.pct {
    left: calc(var(--site-w) + var(--lf-w) + var(--avg-w));
    border-right: 1px solid var(--border);
  }
  tbody td.lf {
    left: var(--site-w);
    border-right: 1px solid var(--border);
  }
  thead th.pct-head { border-right: 1px solid var(--border); }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: none; }
  td.empty { color: #cbd5e1; text-align: center; }
  tr.group th {
    background: #e2ebf3;
    text-align: left;
    font-weight: 650;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    border-top: 1px solid #cbd5e1;
  }
  tr.group th:hover { background: #d7e2ec; }
  tr.group .group-label {
    position: sticky;
    left: 12px;
    display: inline-flex;
    align-items: center;
  }
  tr.group .arrow {
    display: inline-block;
    width: 14px;
    font-size: 10px;
    color: var(--muted);
  }
  tr.group .count {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    border-radius: 9px;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
  }
  .legend {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend .bar {
    width: 120px;
    height: 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: linear-gradient(to right, #ffffff, rgb(26, 115, 232));
  }
  .summary-wrap {
    margin: 0 28px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    overflow: hidden;
  }
  .summary-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    font-weight: 650;
    font-size: 14px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--border);
  }
  .summary-head:hover { background: #e8eef4; }
  .summary-wrap.collapsed .summary-head { border-bottom: none; }
  .summary-wrap.collapsed .summary-body { display: none; }
  .summary-head .arrow {
    display: inline-block;
    width: 14px;
    font-size: 10px;
    color: var(--muted);
  }
  .summary-head .hint {
    margin-left: auto;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .summary-body { padding: 0 16px 12px; overflow: auto; }
  table.summary {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    margin-top: 8px;
  }
  table.summary th, table.summary td {
    padding: 7px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.summary th:first-child, table.summary td:first-child {
    text-align: left;
  }
  table.summary thead th {
    color: var(--muted);
    font-weight: 600;
    border-bottom: 2px solid var(--border);
  }
  table.summary tbody tr:last-child td { border-bottom: none; }
  table.summary tr.industry-row td {
    font-weight: 650;
    background: #eef2f6;
  }
  table.summary tr.sub-row td:first-child {
    padding-left: 28px;
    color: var(--muted);
    font-weight: 500;
  }
  table.summary tfoot td {
    font-weight: 700;
    border-top: 2px solid var(--border);
    background: #f8fafc;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Peak Shaving Report</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span class="legend">low <span class="bar"></span> high</span>
    <div class="toggle">
      <button id="btn-expand">Expand all</button>
      <button id="btn-collapse">Collapse all</button>
    </div>
    <div class="toggle">
      <button data-metric="demand" class="active">Demand shaved (kW)</button>
      <button data-metric="demandPct">Demand shaved (%)</button>
      <button data-metric="energy">Energy delivered (kWh)</button>
      <button data-metric="energyPct">Energy delivered (%)</button>
    </div>
  </div>
</header>
<div class="summary-wrap" id="summary-wrap">
  <div class="summary-head" id="summary-toggle">
    <span class="arrow" id="summary-arrow">&#9660;</span>
    Industry summary
    <span class="hint">Avg demand shaved per site · mean &amp; std dev</span>
  </div>
  <div class="summary-body">
    <table class="summary" id="summary-table"></table>
  </div>
</div>
<div class="table-wrap">
  <table id="matrix"></table>
</div>
<script>
const DATA = __DATA_JSON__;

const customers = Object.keys(DATA.customers).sort((a, b) => {
  const na = Number(a), nb = Number(b);
  if (!isNaN(na) && !isNaN(nb)) return na - nb;
  return a.localeCompare(b);
});

const monthSet = new Set();
for (const id of customers) {
  for (const m of DATA.customers[id]) monthSet.add(m.month);
}
const months = [...monthSet].sort();

const METRICS = {
  demand: { key: "total_demand_shaved_kw", label: "Demand shaved (kW)", unit: "kW", pct: false },
  demandPct: { key: "total_demand_shaved_pct", label: "Demand shaved (%)", unit: "%", pct: true },
  energy: { key: "total_energy_delivered_kwh", label: "Energy delivered (kWh)", unit: "kWh", pct: false },
  energyPct: { key: "total_energy_delivered_pct", label: "Energy delivered (%)", unit: "%", pct: true },
};
let metric = "demand";

// The two summary columns track the metric family (demand vs energy): an
// absolute average and a percentage average that stay fixed when toggling
// between the absolute and percentage view of the same family.
const FAMILY = {
  demand: { abs: "demand", pct: "demandPct" },
  energy: { abs: "energy", pct: "energyPct" },
};
function familyOf(m) {
  return (m === "demand" || m === "demandPct") ? "demand" : "energy";
}

// lookup[customer][month] = month record
const lookup = {};
for (const id of customers) {
  lookup[id] = {};
  for (const m of DATA.customers[id]) lookup[id][m.month] = m;
}

const META = DATA.meta || {};
function subIndustryOf(id) {
  const m = META[id];
  return (m && m.sub_industry) ? m.sub_industry : "Unknown";
}
function industryOf(id) {
  const m = META[id];
  return (m && m.industry) ? m.industry : "Unknown";
}

function mean(arr) {
  if (!arr.length) return null;
  return arr.reduce((s, x) => s + x, 0) / arr.length;
}
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((s, x) => s + (x - m) ** 2, 0) / arr.length);
}

function statsForIds(ids) {
  const kw = [];
  const pct = [];
  for (const id of ids) {
    const k = avgOf(id, METRICS.demand.key);
    const p = avgOf(id, METRICS.demandPct.key);
    if (k !== null) kw.push(k);
    if (p !== null) pct.push(p);
  }
  return {
    n: kw.length,
    avgKw: mean(kw),
    stdKw: stddev(kw),
    avgPct: mean(pct),
    stdPct: stddev(pct),
  };
}

function summaryStats() {
  const tree = new Map();
  for (const id of customers) {
    const ind = industryOf(id);
    const sub = subIndustryOf(id);
    if (!tree.has(ind)) tree.set(ind, new Map());
    const subs = tree.get(ind);
    if (!subs.has(sub)) subs.set(sub, []);
    subs.get(sub).push(id);
  }
  return [...tree.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([industry, subs]) => {
      const allIds = [...subs.values()].flat();
      return {
        name: industry,
        ...statsForIds(allIds),
        subs: [...subs.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([name, ids]) => ({ name, ...statsForIds(ids) }))
          .filter((s) => s.n > 0),
      };
    })
    .filter((g) => g.n > 0);
}

let summaryCollapsed = false;

function summaryRow(label, s, cls) {
  return `<tr class="${cls}"><td>${label}</td><td>${s.n}</td>`
    + `<td>${fmtNum(s.avgKw, false)}</td><td>${fmtNum(s.stdKw, false)}</td>`
    + `<td>${fmtNum(s.avgPct, true)}</td><td>${fmtNum(s.stdPct, true)}</td></tr>`;
}

function renderSummary() {
  const groups = summaryStats();
  const siteKw = [];
  const sitePct = [];
  for (const id of customers) {
    const kw = avgOf(id, METRICS.demand.key);
    const pct = avgOf(id, METRICS.demandPct.key);
    if (kw !== null) siteKw.push(kw);
    if (pct !== null) sitePct.push(pct);
  }

  let html = `<thead><tr>
    <th>Industry / Sub-industry</th>
    <th>Sites</th>
    <th>Avg kW saved</th>
    <th>Std dev kW</th>
    <th>Avg % saved</th>
    <th>Std dev %</th>
  </tr></thead><tbody>`;
  for (const g of groups) {
    html += summaryRow(g.name, g, "industry-row");
    for (const s of g.subs) {
      html += summaryRow(s.name, s, "sub-row");
    }
  }
  html += `</tbody><tfoot><tr>
    <td>All industries</td>
    <td>${siteKw.length}</td>
    <td>${fmtNum(mean(siteKw), false)}</td>
    <td>${fmtNum(stddev(siteKw), false)}</td>
    <td>${fmtNum(mean(sitePct), true)}</td>
    <td>${fmtNum(stddev(sitePct), true)}</td>
  </tr></tfoot>`;
  document.getElementById("summary-table").innerHTML = html;
  document.getElementById("summary-wrap").classList.toggle("collapsed", summaryCollapsed);
  document.getElementById("summary-arrow").textContent = summaryCollapsed ? "\u25B6" : "\u25BC";
}

document.getElementById("summary-toggle").addEventListener("click", () => {
  summaryCollapsed = !summaryCollapsed;
  renderSummary();
});

// Group customers by sub-industry, groups sorted alphabetically; customer
// order within a group preserves the numeric sort from above.
const groups = (() => {
  const byName = new Map();
  for (const id of customers) {
    const name = subIndustryOf(id);
    if (!byName.has(name)) byName.set(name, []);
    byName.get(name).push(id);
  }
  return [...byName.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([name, ids]) => ({ name, ids }));
})();

const collapsed = new Set();

const ACCENT = [26, 115, 232];
function cellColor(v, max) {
  if (max <= 0) return "#ffffff";
  const t = Math.max(0, Math.min(1, v / max));
  const c = ACCENT.map(g => Math.round(255 + (g - 255) * t));
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

function fmtNum(v, pct) {
  if (pct) {
    return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  }
  return v.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}
function fmt(v) {
  return fmtNum(v, METRICS[metric].pct);
}
function avgOf(id, metricKey) {
  const present = months.map(m => lookup[id][m]).filter(Boolean);
  if (!present.length) return null;
  return present.reduce((s, rec) => s + rec[metricKey], 0) / present.length;
}

function monthLabel(m) {
  const [y, mo] = m.split("-");
  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${names[Number(mo) - 1]} ${y}`;
}

function loadFactorOf(id) {
  const m = META[id];
  return (m && m.load_factor != null) ? m.load_factor : null;
}
function fmtLoadFactor(v) {
  if (v === null) return "&ndash;";
  return (v * 100).toLocaleString(undefined, {
    minimumFractionDigits: 1,
    maximumFractionDigits: 1,
  }) + "%";
}

function render() {
  const key = METRICS[metric].key;
  let max = 0;
  for (const id of customers) {
    for (const m of months) {
      const rec = lookup[id][m];
      if (rec) max = Math.max(max, rec[key]);
    }
  }

  const fam = FAMILY[familyOf(metric)];
  const absKey = METRICS[fam.abs].key;
  const pctKey = METRICS[fam.pct].key;
  const totalCols = months.length + 4;
  let html = "<thead><tr>"
    + `<th class="site-head">Customer</th>`
    + `<th class="lf-head">Load factor</th>`
    + `<th class="abs-head">Avg ${METRICS[fam.abs].unit}</th>`
    + `<th class="pct-head">Avg %</th>`;
  for (const m of months) html += `<th>${monthLabel(m)}</th>`;
  html += "</tr></thead><tbody>";
  for (const g of groups) {
    const isCollapsed = collapsed.has(g.name);
    const arrow = isCollapsed ? "\u25B6" : "\u25BC";
    html += `<tr class="group${isCollapsed ? " collapsed" : ""}" data-group="${encodeURIComponent(g.name)}">`
      + `<th colspan="${totalCols}"><span class="group-label"><span class="arrow">${arrow}</span>${g.name}`
      + `<span class="count">${g.ids.length}</span></span></th></tr>`;
    if (isCollapsed) continue;
    for (const id of g.ids) {
      const avgAbs = avgOf(id, absKey);
      const avgPct = avgOf(id, pctKey);
      const absCell = avgAbs === null
        ? `<td class="avg abs empty">&ndash;</td>`
        : `<td class="avg abs">${fmtNum(avgAbs, false)}</td>`;
      const pctCell = avgPct === null
        ? `<td class="avg pct empty">&ndash;</td>`
        : `<td class="avg pct">${fmtNum(avgPct, true)}</td>`;
      const lf = loadFactorOf(id);
      const lfCell = lf === null
        ? `<td class="avg lf empty">&ndash;</td>`
        : `<td class="avg lf" title="Avg ${(META[id] && META[id].avg_kw != null) ? META[id].avg_kw.toLocaleString() : "?"} kW / peak ${(META[id] && META[id].peak_kw != null) ? META[id].peak_kw.toLocaleString() : "?"} kW">${fmtLoadFactor(lf)}</td>`;
      const siteLink = `<a href="site_chart.html?site=${encodeURIComponent(id)}" target="_blank" rel="noopener" title="Open time-series chart for site ${id}">${id}</a>`;
      html += `<tr><th class="site">${siteLink}</th>${lfCell}${absCell}${pctCell}`;
      for (const m of months) {
        const rec = lookup[id][m];
        if (rec) {
          const v = rec[key];
          const t = max > 0 ? v / max : 0;
          const fg = t > 0.6 ? "#ffffff" : "var(--text)";
          html += `<td style="background:${cellColor(v, max)}; color:${fg}">${fmt(v)}</td>`;
        } else {
          html += `<td class="empty">&ndash;</td>`;
        }
      }
      html += "</tr>";
    }
  }
  html += "</tbody>";
  document.getElementById("matrix").innerHTML = html;
  document.getElementById("subtitle").textContent =
    `${METRICS[metric].label} per customer per month · N=${DATA.params.N}, L=${DATA.params.L} · ${customers.length} customers · ${groups.length} sub-industries · click a customer ID to open its time-series chart`;
  document.querySelectorAll("[data-metric]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.metric === metric);
  });
}

document.querySelectorAll("[data-metric]").forEach(btn => {
  btn.addEventListener("click", () => { metric = btn.dataset.metric; render(); });
});

document.getElementById("matrix").addEventListener("click", (e) => {
  const row = e.target.closest("tr.group");
  if (!row) return;
  const name = decodeURIComponent(row.dataset.group);
  if (collapsed.has(name)) collapsed.delete(name);
  else collapsed.add(name);
  render();
});

document.getElementById("btn-expand").addEventListener("click", () => { collapsed.clear(); render(); });
document.getElementById("btn-collapse").addEventListener("click", () => {
  for (const g of groups) collapsed.add(g.name);
  render();
});

render();
renderSummary();
</script>
</body>
</html>
